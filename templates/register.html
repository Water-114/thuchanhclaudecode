{% extends "base.html" %}
{% block title %}Coffee Shop - Đăng ký{% endblock %}

{% block content %}
  <main class="container section">
    <div class="auth-box">
      <h2>Đăng ký tài khoản</h2>
      <p class="section-subtitle">Tạo tài khoản để đặt hàng và theo dõi đơn của bạn</p>

      <form method="POST" class="auth-form" novalidate>
        <div class="form-group">
          <label for="name">Họ và tên</label>
          <input type="text" id="name" name="name" value="{{ form.name }}" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ form.email }}" required>
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="tel" id="phone" name="phone" value="{{ form.phone }}">
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm_password">Xác nhận mật khẩu</label>
          <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn">Đăng ký</button>
      </form>

      <p class="auth-switch">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
    </div>
  </main>
{% endblock %}
